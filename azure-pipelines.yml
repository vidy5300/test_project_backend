trigger:
  - main

pool:
  vmImage: "ubuntu-latest"

variables:
  nodeVersion: "22.x"
  # Replace this with your actual App Service name from Azure Portal
  appServiceName: "testpipelinebackend"

stages:
  - stage: Build
    displayName: "Build and Test"
    jobs:
      - job: BuildAndTest
        displayName: "Build and Test"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "$(nodeVersion)"
            displayName: "Install Node.js"

          - script: |
              npm install
              npm run build
            displayName: "npm install and build"

          - script: |
              npm test
            displayName: "Run Tests"
            condition: succeededOrFailed()

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'dist'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  - stage: Deploy
    displayName: "Deploy to Azure"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: Deploy
        displayName: "Deploy to Azure App Service"
        steps:
          - task: DownloadBuildArtifacts@1
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'drop'
              downloadPath: '$(System.ArtifactsDirectory)'

          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'TestPipelineAzureServiceConnection'
              appName: '$(appServiceName)'
              package: '$(System.ArtifactsDirectory)/drop'
              deploymentMethod: 'auto'
              startupCommand: 'node server.js'
